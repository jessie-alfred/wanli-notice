# 檔案位置：.github/workflows/prune-months.yml
#
# 這個流程只負責一件事：把已過期的月份區塊從 index.html 刪除並存回儲存庫（規則見 prune_months.py）。
# 網站的發佈由 Netlify 負責：儲存庫一有更新，Netlify 就會自動重新發佈。
#
# 什麼時候會執行：
#   - 每天台灣時間 00:10 自動執行一次
#   - 有人上傳或修改檔案（push 到 main）時
#   - 到 Actions 頁面手動執行

name: 刪除過期月份

on:
  push:
    branches: [main]
  schedule:
    # GitHub 的排程使用 UTC 時間：16:10 UTC = 台灣時間每天 00:10
    - cron: "10 16 * * *"
  workflow_dispatch:

permissions:
  contents: write # 需要把「刪除後的 index.html」存回儲存庫

concurrency:
  group: prune
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: 取得檔案
        uses: actions/checkout@v5

      - name: 刪除已過期的月份
        run: python3 prune_months.py index.html

      - name: 如果有刪除，把結果存回儲存庫
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "自動刪除已過期的月份公告"
            git push
          fi
